name: Release

# Builds the portable Windows exe and creates a GitHub Release on every commit to main or on release tags.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Release Tag
        id: vars
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/(.+)') {
            $tag = $Matches[1]
          } else {
            $date = Get-Date -Format "yyyyMMdd"
            $tag = "v0.1.$env:GITHUB_RUN_NUMBER"
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "Tag set to: $tag"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build release binary
        run: pnpm tauri build --no-bundle

      - name: Package portable executable & checksum
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -Exclude "*.pdb" | Select-Object -First 1
          if (-not $exe) {
            throw "Executable not found in src-tauri/target/release"
          }
          Copy-Item $exe.FullName "src-tauri/target/release/Valtrace.exe" -Force
          $hash = (Get-FileHash "src-tauri/target/release/Valtrace.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "src-tauri/target/release/Valtrace.exe.sha256" -Value $hash -NoNewline -Encoding ascii
          Write-Output "Executable SHA256: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Valtrace ${{ steps.vars.outputs.tag }}"
          files: |
            src-tauri/target/release/Valtrace.exe
            src-tauri/target/release/Valtrace.exe.sha256
          generate_release_notes: true
