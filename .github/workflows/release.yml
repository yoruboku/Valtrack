name: Release

# Cross-compiles the portable Windows exe on Linux (ubuntu-latest) targeting x86_64-pc-windows-msvc
# via cargo-xwin to save GitHub Actions runner minutes and costs.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Release Tag
        id: vars
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(.+) ]]; then
            tag="${BASH_REMATCH[1]}"
          else
            tag="v0.1.$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag set to: $tag"

      - name: Install LLVM / Clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Windows release binary via cargo-xwin
        run: pnpm tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --no-bundle

      - name: Package portable executable & checksum
        run: |
          target_file="src-tauri/target/x86_64-pc-windows-msvc/release/valtrack.exe"
          if [ ! -f "$target_file" ]; then
            target_file=$(find src-tauri/target -name "valtrack.exe" | head -n 1)
          fi
          if [ ! -f "$target_file" ]; then
            echo "Error: valtrack.exe not found"
            find src-tauri/target -type f -name "*.exe"
            exit 1
          fi
          echo "Found executable: $target_file"
          mkdir -p release-artifacts
          cp "$target_file" release-artifacts/valtrack.exe
          cd release-artifacts
          sha256sum valtrack.exe | awk '{print $1}' > valtrack.exe.sha256
          echo "SHA256: $(cat valtrack.exe.sha256)"
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Valtrack ${{ steps.vars.outputs.tag }}"
          files: |
            release-artifacts/valtrack.exe
            release-artifacts/valtrack.exe.sha256
          generate_release_notes: true
