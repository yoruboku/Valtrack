name: Release

# Cross-compiles the portable Windows exe on Linux (ubuntu-24.04) targeting x86_64-pc-windows-msvc
# via cargo-xwin to save GitHub Actions runner minutes and costs.
# Releases are triggered exclusively by version tags (vX.Y.Z) or manual workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format & verify manifests
        id: vars
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(.+) ]]; then
            tag="${BASH_REMATCH[1]}"
          else
            tag="v$(node -p 'require("./package.json").version')"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$tag' is not a valid release tag. Release tags must be vX.Y.Z (e.g. v0.2.0)."
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building release for tag $tag (version $version)"

          node -e '
            const fs = require("fs");
            const expected = "'"$version"'";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/\[package\][^\[]*?\bversion\s*=\s*"([^"]+)"/)?.[1];
            const mismatches = [];
            if (pkg !== expected) mismatches.push(`package.json: ${pkg}`);
            if (tauri !== expected) mismatches.push(`tauri.conf.json: ${tauri}`);
            if (cargo !== expected) mismatches.push(`Cargo.toml: ${cargo}`);
            if (mismatches.length > 0) {
              console.error(`Version mismatch for tag v${expected}:\n  ` + mismatches.join("\n  "));
              process.exit(1);
            }
          '

      - name: Extract curated release notes from CHANGELOG.md
        run: |
          node -e '
            const fs = require("fs");
            const version = "'"${{ steps.vars.outputs.version }}"'";
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const lines = changelog.split("\n");
            let start = -1;
            for (let i = 0; i < lines.length; i++) {
              if (lines[i].match(new RegExp(`^##\\s+v${version.replace(/\\./g, "\\\\.")}(?!\\d)`))) {
                start = i;
                break;
              }
            }
            if (start < 0) {
              console.error(`CHANGELOG.md has no ## v${version} section.`);
              process.exit(1);
            }
            const body = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (lines[i].match(/^##\s/)) break;
              body.push(lines[i]);
            }
            const notes = body.join("\n").trim();
            if (!notes) {
              console.error(`The ## v${version} section in CHANGELOG.md is empty.`);
              process.exit(1);
            }
            fs.mkdirSync("release-artifacts", { recursive: true });
            fs.writeFileSync("release-artifacts/release-notes.md", notes);
          '

      - name: Install system dependencies (LLVM, Clang, LLD, WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - name: Cache Windows MSVC SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            ~/.xwin-cache
          key: xwin-cache-${{ runner.os }}-v2

      - name: Pre-fetch Windows MSVC Sysroot
        run: |
          for i in {1..3}; do
            cargo xwin cache windows-msvc-sysroot && break || sleep 5
          done
        env:
          XWIN_CROSS_COMPILER: clang

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend typecheck and build
        run: pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows release binary via cargo-xwin
        run: pnpm tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --no-bundle
        env:
          XWIN_CROSS_COMPILER: clang

      - name: Package portable executable & checksum
        run: |
          target_file="src-tauri/target/x86_64-pc-windows-msvc/release/valtrack.exe"
          if [ ! -f "$target_file" ]; then
            target_file=$(find src-tauri/target -name "valtrack.exe" | head -n 1)
          fi
          if [ ! -f "$target_file" ]; then
            echo "Error: valtrack.exe not found"
            find src-tauri/target -type f -name "*.exe"
            exit 1
          fi
          echo "Found executable: $target_file"
          mkdir -p release-artifacts
          cp "$target_file" release-artifacts/valtrack.exe
          cd release-artifacts
          printf "%s" $(sha256sum valtrack.exe | awk '{print $1}') > valtrack.exe.sha256
          echo "SHA256: $(cat valtrack.exe.sha256)"
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Valtrack ${{ steps.vars.outputs.tag }}"
          body_path: release-artifacts/release-notes.md
          files: |
            release-artifacts/valtrack.exe
            release-artifacts/valtrack.exe.sha256
          fail_on_unmatched_files: true
